---
name: Publish

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
          no-cache: true # never publish from a restored cache

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never publish from a restored cache

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      - name: Publish
        run: npm publish --access public --provenance

  # Docker Hub has no OIDC for personal accounts, so this uses an access
  # token, stored only in the environment `docker-hub`. Only releases have a
  # version tag to derive the image tags from.
  docker:
    name: Publish to Docker Hub
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: docker-hub
      url: https://hub.docker.com/r/udondan/dsbmobile
    permissions:
      contents: read
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The image takes the compiled dist/, it doesn't compile TypeScript itself.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
          no-cache: true # never publish from a restored cache

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false # never publish from a restored cache

      - run: bun install --frozen-lockfile
      - run: bun run build

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Release tag v1.2.3 → 1.2.3, 1.2, 1 and latest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: udondan/dsbmobile
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # Keyless: the signature names this workflow as signer, via GitHub OIDC
      # and the public Sigstore log. Signing the digest covers all tags.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "udondan/dsbmobile@${DIGEST}"
