---
name: Publish

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      - name: Publish
        run: npm publish --access public --provenance
