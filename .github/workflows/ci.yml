---
name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    if: github.event_name == 'pull_request'
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - src/**
              - tests/**
              - package.json
              - bun.lock
              - tsconfig*.json
              - eslint.config.js
              - .prettierrc.json
              - .prettierignore
              - .markdownlint.json
              - vitest.config.ts
              - .github/workflows/ci.yml

  # All runs share one live DSBmobile account. Many parallel runs, for
  # example of several Renovate PRs, would send bursts of requests that look
  # suspicious, so only one run at a time may run the integration tests.
  wait-for-turn:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write # lock refs under refs/wait-for-turn/
      pull-requests: read # labels for label-weights
    # A new commit on the branch cancels the waiting of the outdated run, so the
    # new run doesn't queue behind it. Once a run has the turn, this job is
    # done: test jobs that already run are never cancelled.
    concurrency:
      group: test-wait-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      # Queue order: manual PRs first, then Renovate updates, then the
      # release-please PR, which is updated after every merge to main anyway.
      # Fails right away if the branch is behind main. Branch protection
      # requires PRs to be up to date, so testing an outdated branch is wasted
      # time: it has to be updated and tested again.
      - name: Wait for turn
        uses: udondan/wait-for-turn@4a9f5171a1dbc3eb182410c772dae951e8ac26e3 # v1.3.0
        with:
          require-up-to-date: true
          label-weights: |
            autorelease: pending=-10
            renovate=-5

  test:
    runs-on: ubuntu-latest
    needs: [changes, wait-for-turn]
    # Pull requests from forks can't take the turn and skip the wait, as they
    # don't get the secrets. Fail if the wait failed or was cancelled.
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true')) }}
    steps:
      - name: Check turn
        if: needs.wait-for-turn.result == 'failure' || needs.wait-for-turn.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run markdownlint
      - run: bun run test
      - name: Run integration tests
        run: bun run test -- tests/api.integration.test.ts
        env:
          DSB_USERNAME: ${{ secrets.DSB_USERNAME }}
          DSB_PASSWORD: ${{ secrets.DSB_PASSWORD }}
          DSB_CLASS: ${{ secrets.DSB_CLASS }}

  required:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always()
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.result }}" == "failure" || \
                "${{ needs.changes.result }}" == "cancelled" || \
                "${{ needs.test.result }}" == "failure" || \
                "${{ needs.test.result }}" == "cancelled" ]]; then
            exit 1
          fi
