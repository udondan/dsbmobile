---
name: Release Please

on:
  workflow_dispatch:
  push:
    branches:
      - main

# The job uses OVERRIDE_TOKEN, not the GITHUB_TOKEN.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.OVERRIDE_TOKEN }}
