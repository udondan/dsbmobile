config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/.claude/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "block"

[[source]]
name = "default"
default = true

# Linters that CI doesn't run already: security and bug rules for TypeScript,
# secret scanners and Dockerfile checks.
[[plugin]]
name = "radarlint-js"

[[plugin]]
name = "trivy"

[[plugin]]
name = "gitleaks"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "hadolint"

# The Docker MCP Toolkit expects exactly these label keys (com.docker.desktop.mcp*).
[[triage]]
match.rules = ["hadolint:DL3048"]
match.file_patterns = ["Dockerfile"]
set.ignored = true

# The image runs a stdio MCP server or the CLI. There is no port or process a
# HEALTHCHECK could probe.
[[triage]]
match.rules = ["trivy:DS-0026"]
match.file_patterns = ["Dockerfile"]
set.ignored = true
