# Server definition for the Docker MCP Toolkit.
# Add it to a profile with `mise run docker-register` (see README, section Docker MCP Toolkit).
name: dsbmobile
type: server
image: udondan/dsbmobile:latest
title: DSBmobile
description: German school substitution plans (Vertretungspläne), timetables, news and documents via DSBmobile
secrets:
  - name: dsbmobile.username
    env: DSB_USERNAME
    example: '123456'
    description: DSBmobile username/ID
  - name: dsbmobile.password
    env: DSB_PASSWORD
    example: your_password
    description: DSBmobile password
  - name: dsbmobile.class
    env: DSB_CLASS
    example: 07b
    description: Default class filter for get_substitutions (optional)
