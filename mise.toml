[tools]
bun = "1.3.14"
node = "22"

[tasks.install]
description = "Install dependencies and set up git hooks"
run = ["bun install", "mise run install-hooks"]

[tasks."install-hooks"]
description = "Point git at the tracked hooks directory"
run = "git config core.hooksPath hooks/"

[tasks.build]
description = "Compile TypeScript"
run = "bun run build"

[tasks.dev]
description = "Watch mode (recompile on changes)"
run = "bun run dev"

[tasks.start]
description = "Start MCP server"
run = "node dist/cli.js mcp"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf dist"

[tasks.inspect]
description = "Open MCP Inspector to test the server interactively"
run = "bunx @modelcontextprotocol/inspector node dist/cli.js mcp"

[tasks.test]
description = "Run unit tests"
run = "bun run test"

[tasks."test:integration"]
description = "Run integration tests against the real DSBmobile API (requires DSB_USERNAME and DSB_PASSWORD)"
run = "bun run test -- tests/api.integration.test.ts"

[tasks.typecheck]
description = "Type-check without emitting files"
run = "bun run typecheck"

[tasks.lint]
description = "Run ESLint"
run = "bun run lint"

[tasks."lint:fix"]
description = "Auto-fix ESLint issues"
run = "bun run lint:fix"

[tasks.format]
description = "Format all files with Prettier"
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
run = "bun run format:check"

[tasks.markdownlint]
description = "Lint markdown files"
run = "bun run markdownlint"
